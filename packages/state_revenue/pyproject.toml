[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "census-state-revenue"
version = "0.1.0"
description = "Every Hawaii state tax as one ledger: DOTAX collections by line, tiered by how far each can be modelled."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tom Katsumi", email = "dtomkatsu@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/state_revenue"]
