[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "census-forecaster"
version = "0.2.0"
description = "Forecast current-period values from older ACS estimates and BLS series, with calibrated uncertainty."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tom Katsumi", email = "dtomkatsu@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = ["acs", "census", "bls", "forecasting", "nowcasting", "cpi", "inflation"]
dependencies = [
    "requests>=2.28",
    "census-common",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
ml = ["scikit-learn>=1.1", "numpy>=1.21"]
# openpyxl is only needed by scripts/refresh_dotax_collections.py (DOTAX
# publishes XLSX); the bundled JSON is readable without it.
dotax = ["openpyxl>=3.1"]
# pdfplumber is only needed by scripts/refresh_cor_iit.py (COR publishes its
# line-item attachment as PDF); the bundled JSON is readable without it.
cor = ["pdfplumber>=0.11"]

[project.urls]
Homepage = "https://github.com/Hawaii-Appleseed/Census-Forecaster"
Issues = "https://github.com/Hawaii-Appleseed/Census-Forecaster/issues"

[tool.hatch.build.targets.wheel]
# packages already ships every tracked file under src/census_forecaster,
# including data/. Do NOT re-add a force-include for data/ — hatchling
# ≥1.19 fails the build on the duplicate paths it creates.
packages = ["src/census_forecaster"]
