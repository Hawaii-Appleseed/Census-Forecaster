[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tax-modeler"
version = "0.1.0"
description = "Hawaii state income tax + federal EITC microsimulation, built on Census-Forecaster microdata."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tom Katsumi", email = "dtomkatsu@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = ["tax", "eitc", "ctc", "hawaii", "microsimulation"]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.5",
    "pyarrow>=12",
    "scikit-learn>=1.1",
    "scipy>=1.10",
    "openpyxl>=3.1",
    "requests>=2.28",
    "tqdm>=4.65",
    "joblib>=1.3",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
    # reporting.brief imports both eagerly (charts.py -> matplotlib,
    # pdf_renderer.py -> fpdf). Not optional: `from tax_modeler.reporting.brief
    # import ...` fails at import time without them, which breaks pytest
    # collection for the whole suite.
    "matplotlib>=3.7",
    "fpdf2>=2.7",
    "census-common",
    "census-forecaster",
    "pums-estimator",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.17"]
ui = ["streamlit>=1.30"]
geo = ["geopandas>=0.14"]
# pyreadstat is needed only by the optional CEX (Consumer Expenditure
# Survey) loader, which reads SAS XPT files. Most users don't need it.
cex = ["pyreadstat>=1.2"]

[tool.hatch.build.targets.wheel]
# packages already ships every tracked file under src/tax_modeler,
# including data/. Do NOT re-add a force-include for data/ — hatchling
# ≥1.19 fails the build on the duplicate paths it creates.
packages = ["src/tax_modeler"]
