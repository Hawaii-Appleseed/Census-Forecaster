[tool.uv.workspace]
members = [
    "packages/common",
    "packages/census_forecaster",
    "packages/pums_estimator",
    "packages/tax_modeler",
    "packages/lab",
]

[tool.uv.sources]
census-common = { workspace = true }
census-forecaster = { workspace = true }
pums-estimator = { workspace = true }
tax-modeler = { workspace = true }
census-lab = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "smoke: fast end-to-end and per-stage tests on the synthetic fixture; safe to run on a fresh clone without DOTAX/IRS data.",
    "requires_dotax_raw: needs ~83 MB of Hawaii DOTAX SOI tables in data/tax_modeler/raw/.",
    "requires_irs_external: needs ~639 MB of IRS national SOI files in data/tax_modeler/external/.",
]
