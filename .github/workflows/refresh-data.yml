name: refresh-data

# Auto-refresh the bundled BLS panel + BEA anchors + calibration JSONs.
# Runs monthly on the 5th (after BLS / BEA monthly releases settle) plus
# on-demand via workflow_dispatch. If any data file actually changes, the
# workflow auto-commits the refresh with `[skip ci]` to avoid recursive
# triggering of the test workflow.
#
# API keys are stored as GitHub Secrets:
#   BLS_API_KEY  — https://www.bls.gov/developers/api_signature_v2.htm
#   BEA_API_KEY  — https://apps.bea.gov/api/signup/
#   EIA_API_KEY  — https://www.eia.gov/opendata/register.php
#
# The workflow is idempotent: running it twice in a row produces no diff.
#
# Ordering constraint: refresh_market_panel.py's macro write is a FULL
# REPLACE of macro_monthly.json (it has no existing-file merge step), so
# it must run before every step below that merges additively into that
# same file (national-macro, EIA, HTA, DBEDT, UI-claims) — reversing the
# order would silently drop whatever those steps last wrote.

on:
  schedule:
    # 06:00 UTC on the 5th of each month — well after the BLS midmonth
    # CPI release (typically the 10th-15th, but we re-run early to catch
    # the previous month's revision window) and BEA Regional releases.
    - cron: '0 6 5 * *'
  workflow_dispatch:

# Prevent overlapping runs from corrupting the bundled data files mid-write.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needs to push the auto-commit back to main
      issues: write     # the "Alert on failure" step opens an issue

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use a PAT or default GITHUB_TOKEN for the push later.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install census-forecaster package
        # --extra dotax pulls openpyxl, which refresh_dotax_collections
        # needs to read DOTAX's XLSX reports (it exits 2 without it).
        run: uv sync --package census-forecaster --extra dev --extra markets --extra dotax --extra cor

      - name: Refresh BLS multi-MSA panel
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          if [ -z "${BLS_API_KEY}" ]; then
            echo "::warning::BLS_API_KEY not set; skipping BLS panel refresh"
          else
            uv run python -m census_forecaster.scripts.refresh_bls_panel \
              --start-year 2010
          fi

      - name: Refresh BEA anchors
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: |
          if [ -z "${BEA_API_KEY}" ]; then
            echo "::warning::BEA_API_KEY not set; skipping BEA refresh"
          else
            uv run python -m census_forecaster.scripts.refresh_bea_anchors --verify
          fi

      - name: Refresh Zillow + BLS LAUS county anchors
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          # Zillow CSV downloads need no API key, so run them
          # unconditionally. The LAUS portion needs BLS_API_KEY; if it's
          # missing we skip *just* LAUS and still get the housing block
          # refreshed.
          if [ -z "${BLS_API_KEY}" ]; then
            echo "::warning::BLS_API_KEY not set; refreshing Zillow only (skipping LAUS)"
            uv run python -m census_forecaster.scripts.refresh_zillow_laus_anchors --skip-laus
          else
            uv run python -m census_forecaster.scripts.refresh_zillow_laus_anchors
          fi

      - name: Refresh BPS county permit counts
        run: |
          # No API key required — Census BPS data is publicly available.
          uv run python -m census_forecaster.scripts.refresh_bps_permits

      - name: Refresh Census SAIPE county poverty rates
        env:
          # Census now REQUIRES a key for this endpoint (a keyless request
          # returns an HTML "Missing Key" page). Set the CENSUS_API_KEY repo
          # secret (free signup: https://api.census.gov/data/key_signup.html).
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          uv run python -m census_forecaster.scripts.refresh_saipe

      - name: Refresh market prices panel + macro monthly series
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          # Ticker prices need no API key (yfinance/Stooq are keyless);
          # the script skips just the BLS unemployment block when
          # BLS_API_KEY is absent. --tolerate-failures keeps the
          # previously committed series for any ticker whose fetch fails
          # (yfinance breaks periodically) so a flaky source never fails
          # the whole refresh.
          uv run python -m census_forecaster.scripts.refresh_market_panel \
            --tolerate-failures --derive-signals

      - name: Refresh national-macro predictor series
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          # National CPI (from the panel) + BLS AHE/LFPR/emp-pop/JOLTS
          # (keyless) + FRED mortgage/10yr/HVS (keyless CSV). Each block
          # degrades with a ::warning and keeps previously committed data;
          # aborts only if nothing fetched.
          uv run python -m census_forecaster.scripts.refresh_national_macro

      - name: Refresh EIA Hawaii electricity price
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          # Monthly Hawaii retail electricity price (2001+, ~3-month lag)
          # — the genuine monthly Hawaii price proxy the causal screen's
          # CPI-directed hypotheses needed. Merges additively into
          # macro_monthly.json.
          if [ -z "${EIA_API_KEY}" ]; then
            echo "::warning::EIA_API_KEY not set; skipping EIA electricity refresh"
          else
            uv run python -m census_forecaster.scripts.refresh_eia_hawaii
          fi

      - name: Refresh DBEDT monthly economic indicators
        run: |
          # No API key required — DBEDT publishes keyless per-county
          # workbooks. Visitor arrivals (current month) + county building
          # permits, 1990- -> today at ~5-week lag. The listing page is
          # scraped for the current dated link, so this survives URL
          # rotation; a page-layout change would need the fetcher updated.
          uv run python -m census_forecaster.scripts.refresh_dbedt_mei

      - name: Refresh HTA historical visitor arrivals
        run: |
          # No API key required. Archival cross-check for DBEDT arrivals
          # above (1990-2024 backbone; the two agreed to within 0.0004%
          # on all 420 overlap months at integration time). The HTA
          # workbook only republishes yearly, so this step is normally a
          # no-op between annual updates — kept in the monthly job so a
          # new "through-<year>" workbook is picked up automatically
          # rather than requiring someone to remember to check.
          uv run python -m census_forecaster.scripts.refresh_hta_visitors

      - name: Refresh DOL weekly UI initial claims
        run: |
          # No API key required — keyless all-states CSV (~13 MB). The
          # fastest-moving labour signal in the panel (~11-day lag at the
          # weekly grain). One fetch, two outputs: calendar-month means
          # for Hawaii (the causal screen's monthly grid) and per-state
          # calendar-year means (leading_indicators/ui_claims.json, the
          # ML STATE_SERIES channel).
          uv run python -m census_forecaster.scripts.refresh_ui_claims

      - name: Refresh Hawaii FRED + BTS indicators
        run: |
          # No API key required. HIPHCI (Philadelphia Fed Hawaii coincident
          # index) and HIBPPRIV (Hawaii permit UNIT counts) via keyless FRED
          # CSV; BTS T-100 HNL enplanements/departures via Socrata. Each
          # source degrades with a ::warning and keeps previous values.
          uv run python -m census_forecaster.scripts.refresh_hawaii_indicators

      - name: Refresh FEMA Hawaii disaster declarations
        run: |
          # No API key required. NOT a predictor — a robustness control,
          # the same kind of thing exclude_2020 is. Writes its own file
          # (hi_disasters.json), so it does not touch macro_monthly and
          # its position in this ordering does not matter.
          uv run python -m census_forecaster.scripts.refresh_fema_disasters

      - name: Refresh Realtor.com Hawaii listing metrics
        run: |
          # No API key required. County listing-side indicators (days on
          # market, price-cut share, pending ratio, active/new counts) —
          # the only series in the panel measured while a home is still
          # on the market rather than at closing.
          #
          # Streams a ~100 MB national CSV and keeps the 4 Hawaii
          # counties; nothing that large is written to disk. Merge
          # semantics, so it must stay AFTER refresh_market_panel.
          uv run python -m census_forecaster.scripts.refresh_realtor_inventory

      - name: Refresh DOTAX monthly tax collections
        run: |
          # No API key required (needs openpyxl — see the --extra dotax on
          # the install step above). Revenue ground truth for the model's
          # targets: individual withholding, GE&Use, TAT.
          #
          # The bundle is an ACCUMULATING ARCHIVE, not a snapshot: DOTAX
          # only keeps roughly the current fiscal year up as XLSX (older
          # months fall back to PDF-only), so the script merges into the
          # committed JSON and must never be run in a way that truncates
          # it to one fetch. That accumulation is exactly why this
          # belongs on the monthly cron — every month it runs is history
          # that would otherwise fall off the DOTAX site unrecoverably.
          #
          # --tolerate-throttle: files.hawaii.gov sits behind Cloudflare,
          # which answered this runner with 429 on the first file
          # (2026-09-23) and so sank every later step, commit included.
          # A throttled month is recoverable (~12 months stay online), a
          # lost month of every other refresh is not worth that trade.
          uv run python -m census_forecaster.scripts.refresh_dotax_collections --tolerate-throttle

      - name: Refresh Council on Revenues IIT projections
        id: cor
        run: |
          # No API key required (needs pdfplumber — see the --extra cor on the
          # install step above). Scrapes the COR meeting page for the newest
          # General Fund "Attachment 1" (the DOTAX Tax Research & Planning
          # line-item table) and re-derives the IIT projections that
          # tax_modeler's cor_scale_factor_for_year uses.
          #
          # COR meets on no fixed cadence (~4-5 times a year), which is
          # exactly why this is automated: the constant it replaces had gone
          # stale on the March 10, 2026 vintage while the May 21, 2026
          # forecast was already published.
          #
          # SNAPSHOT semantics, not accumulate: each run replaces the file
          # with the newest vintage. A network failure warns and keeps the
          # committed data; a layout change fails the step loudly rather
          # than writing a misaligned dict.
          #
          # A new COR vintage is a REVIEW EVENT, not just a data bump: the
          # forecast doc quotes COR figures in prose, and a new meeting may
          # carry new DOTAX fiscal estimates for enacted acts. Capture the
          # transition so the step below can open an issue instead of
          # letting it land as a silent [skip ci] commit.
          set -o pipefail
          OUT=$(uv run python -m census_forecaster.scripts.refresh_cor_iit 2>&1 | tee /dev/stderr)
          if echo "$OUT" | grep -q 'NEW VINTAGE'; then
            {
              echo "new_vintage=true"
              echo "line=$(echo "$OUT" | grep 'NEW VINTAGE' | head -1)"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Flag a new COR vintage for review
        if: steps.cor.outputs.new_vintage == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Deliberately an issue, not just a commit: someone needs to read the
          # new COR letter for revised DOTAX estimates of enacted acts (the
          # May 21, 2026 letter, for instance, carried COR's own Act 46 loss
          # figures, which SB3125_CD1_FORECAST.md cross-checks against).
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create \
            --title "New COR vintage picked up — review the forecast doc" \
            --body "The monthly refresh found a newer Council on Revenues General Fund forecast.

          \`${{ steps.cor.outputs.line }}\`

          The bundled \`cor_iit_projections.json\` has been updated automatically, so
          \`cor_scale_factor_for_year\` is already on the new vintage. What still needs a human:

          - [ ] Read the new COR letter for **revised DOTAX estimates of enacted acts** (Act 46, Act 24). These are prose in the letter, not in the line-item attachment, so nothing parses them.
          - [ ] Update the COR figures quoted in \`SB3125_CD1_FORECAST.md\` (the COR vintage section, the Act 46 cross-check table, and Baseline Validation).
          - [ ] Confirm the FY→TY mapping still holds if COR changed its column span.

          Run: \$RUN_URL"

      - name: Regenerate BLS v3 calibration
        run: |
          # Only regenerate if the BLS panel exists. If neither key is
          # set, the calibration step would crash on a missing panel.
          if [ -f packages/census_forecaster/src/census_forecaster/data/bls_panel/cpi_panel.json ]; then
            uv run python -m census_forecaster.backtest.cpi --stratify
          else
            echo "::warning::BLS panel not present; skipping BLS calibration"
          fi

      - name: Regenerate ACS v3 calibration
        run: |
          # Regenerate ACS calibration.json from the bundled multi-state panel.
          # The panel (acs_panel.json + county_population_2020.json) is committed
          # to the repo, so this step needs no API key. If the panel files are
          # absent (e.g. first-ever checkout before anyone ran build_calibration_panel),
          # the script exits cleanly with a warning rather than failing the workflow.
          if [ -f packages/census_forecaster/src/census_forecaster/data/calibration_panel/acs_panel.json ]; then
            uv run python -m census_forecaster.scripts.run_acs_calibration --as-of-mode publication --include-ml --include-conformal
          else
            echo "::warning::ACS calibration panel not present; skipping ACS calibration"
          fi

      - name: Smoke-test the pipeline against refreshed data
        # Run the structural smoke suite, NOT the full suite. The full suite
        # includes ~40 data-pinned golden/MAPE assertions that legitimately
        # drift with each external-data refresh; running them here turns normal
        # drift into a hard block. Golden value tests still run in the regular
        # `tests` workflow against committed data (where they catch real code
        # regressions). This gate confirms the pipeline still runs end-to-end.
        #
        # Scoped to tests/census_forecaster/, not the whole tests/ tree:
        # this job only installs `--package census-forecaster`, so a
        # collection-time import anywhere under tests/tax_modeler/ that
        # needs a tax_modeler-only dependency (e.g. matplotlib, pulled in
        # eagerly by tax_modeler.reporting.brief) fails the whole pytest
        # session before marker filtering ever runs — a real 2026-08-05
        # failure, not hypothetical. The full cross-package suite already
        # runs in the `tests` workflow, which installs the full workspace.
        run: uv run pytest tests/census_forecaster -m smoke -v --tb=short

      - name: Commit + push if data changed
        run: |
          git config user.name 'census-forecaster-refresh-bot'
          git config user.email 'noreply@anthropic.com'

          # Only commit data and report files; never accidentally pick
          # up source-code edits that someone might have made between
          # checkout and now (shouldn't happen, but defense in depth).
          git add \
            packages/census_forecaster/src/census_forecaster/data/bls_panel/ \
            packages/census_forecaster/src/census_forecaster/data/anchors/ \
            packages/census_forecaster/src/census_forecaster/data/calibration_panel/ \
            packages/census_forecaster/src/census_forecaster/data/leading_indicators/ \
            packages/census_forecaster/src/census_forecaster/data/markets/ \
            packages/census_forecaster/src/census_forecaster/data/dotax_monthly/ \
            packages/census_forecaster/src/census_forecaster/data/cor/ \
            backtests/results/

          if git diff --staged --quiet; then
            echo "[refresh] no data changes; nothing to commit"
            exit 0
          fi

          REFRESH_DATE=$(date -u +'%Y-%m-%d')
          MSG="chore(data): monthly refresh ${REFRESH_DATE} [skip ci]

          Auto-refresh from monthly cron run.

          - BLS multi-MSA panel re-fetched from the BLS public API
          - BEA anchors re-fetched from the BEA Regional API
          - Zillow ZHVI/ZORI + BLS LAUS county anchors re-fetched
          - Census BPS county permit counts re-fetched
          - Census SAIPE county poverty rates re-fetched
          - Market prices panel + macro monthly series re-fetched
          - National-macro predictor series re-fetched
          - EIA Hawaii electricity price re-fetched (if EIA_API_KEY set)
          - DBEDT monthly economic indicators re-fetched
          - HTA historical visitor arrivals re-fetched
          - DOL weekly UI initial claims re-fetched
          - DOTAX monthly tax collections merged into the accumulating bundle
          - Council on Revenues IIT projections re-derived from the newest GF attachment
          - BLS v3 calibration regenerated against the new panel
          - ACS v3 calibration regenerated against the bundled panel

          Co-Authored-By: Claude Opus 4.7 <noreply@anthropic.com>"
          git commit -m "$MSG"
          git push

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Surface a failed monthly refresh immediately instead of letting it
          # go unnoticed. Reuse a single open issue so repeated failures comment
          # rather than spam new issues; a fresh one opens after it's closed.
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="refresh-data workflow is failing"
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again — run: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The scheduled \`refresh-data\` workflow failed.

          Latest run: $RUN_URL

          Check which step failed (BLS / BEA / Zillow+LAUS / BPS / SAIPE / market-panel refresh, calibration regen, or the smoke gate). Common causes: an external-data API change (e.g. Census requiring \`CENSUS_API_KEY\`) or a transient timeout. Auto-opened on failure; close once resolved."
          fi
