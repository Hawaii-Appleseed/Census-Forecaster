name: tests

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'tests/**'
      - 'chain/**'
      - 'analyses/**'
      - 'site/**'
      - 'scripts/build_site.py'
      - 'pyproject.toml'
      - 'ruff.toml'
      - 'uv.lock'
  pull_request:
    branches: [main]

# A new push to a PR cancels that PR's run still in progress.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast smoke job: synthetic-fixture-only, runs on every push, < 30s.
  # Failures here block the slow suite below.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install workspace (dev only, smoke fixture has no external deps)
        run: uv sync --all-packages --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Run smoke tests
        run: uv run pytest -m smoke -v --tb=short

      # The tax simulator's browser kernel against the Python model: golden
      # fixtures and the population the page loads, both committed
      # (tests/simulator/, site/data/tax-simulator/). No npm packages.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tax simulator kernel parity
        run: node --test tests/simulator/*.test.mjs

  test:
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install workspace (all packages + dev + ml)
        run: uv sync --all-packages --extra dev --extra ml

      # One run per version. 3.12 runs it under coverage rather than running
      # the suite a second time for the summary (that doubled its job to ~11 min).
      - name: Run full test suite
        if: matrix.python-version != '3.12'
        run: uv run pytest tests/ -v --tb=short

      - name: Run full test suite (with coverage)
        if: matrix.python-version == '3.12'
        run: uv run coverage run --source=packages -m pytest tests/ -v --tb=short

      - name: Show coverage summary
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: uv run coverage report -m
